<!doctype html>

<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title data-i18n="admin_title_page">Admin - Solargrafie</title>
    <!-- PWA Meta Tags -->
    <meta content="#0b0f17" name="theme-color" />
    <!-- Stylesheets -->
    <link href="style.css" rel="stylesheet" />
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Plus+Jakarta+Sans:wght@500;600;700&amp;display=swap"
      rel="stylesheet"
    />
    <!-- Leaflet CDN -->
    <link
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      rel="stylesheet"
    />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Config -->
    <script src="config.js"></script>
    <style>
      /* Zusätzliche Admin-spezifische Styles, angelehnt an das Hauptdesign */
      body {
        background-color: var(--color-bg);
        color: var(--color-text-main);
        display: flex;
        flex-direction: column;
        overflow-y: auto;
        align-items: center;
        justify-content: flex-start;
        min-height: 100vh;
        margin: 0;
        padding: 60px 20px 20px 20px;
        box-sizing: border-box;
      }

      .admin-card {
        background: rgba(25, 28, 36, 0.6);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 16px;
        padding: 40px;
        max-width: 800px; /* angepasst für Admin-Layout */
        width: 100%;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        text-align: center;
      }

      .admin-card h1 {
        font-family: var(--font-head);
        color: var(--color-primary);
        margin-top: 0;
        margin-bottom: 24px;
        font-size: 2rem;
      }

      .admin-card p {
        font-family: var(--font-body);
        color: var(--color-text-muted);
        line-height: 1.6;
        margin-bottom: 32px;
      }

      .btn {
        background: rgba(14, 165, 233, 0.15);
        border: 1px solid var(--color-primary);
        color: var(--color-primary);
        padding: 12px 24px;
        border-radius: 8px;
        font-family: var(--font-body);
        font-weight: 500;
        font-size: 1rem;
        cursor: pointer;
        transition: all 0.3s ease;
        display: inline-flex;
        align-items: center;
        justify-content: flex-start;
        gap: 8px;
        text-decoration: none;
      }

      .btn:hover {
        background: var(--color-primary);
        color: #000;
        box-shadow: 0 0 15px rgba(14, 165, 233, 0.4);
      }

      .btn-secondary {
        background: transparent;
        border-color: var(--color-text-muted);
        color: var(--color-text-muted);
      }

      .btn-secondary:hover {
        background: rgba(255, 255, 255, 0.1);
        color: var(--color-text-main);
        border-color: var(--color-text-main);
        box-shadow: none;
      }

      .hidden {
        display: none !important;
      }

      .user-info {
        margin-bottom: 24px;
        font-family: var(--font-body);
        font-weight: 500;
      }

      .user-email {
        color: var(--color-primary);
      }

      .dashboard-content {
        background: rgba(0, 0, 0, 0.2);
        border-radius: 8px;
        padding: 60px 20px 20px 20px;
        margin-bottom: 24px;
        border: 1px dashed rgba(255, 255, 255, 0.1);
      }

      .back-link {
        position: absolute;
        top: 20px;
        left: 20px;
        color: var(--color-text-muted);
        text-decoration: none;
        font-family: var(--font-body);
        font-size: 0.9rem;
        display: flex;
        align-items: center;
        gap: 6px;
        transition: color 0.3s;
      }

      .back-link:hover {
        color: var(--color-primary);
      }

      /* Layout Dashboard */
      .admin-layout {
        display: flex;
        flex-direction: column;
        overflow-y: auto;
        gap: 30px;
        width: 100%;
        max-width: 800px; /* Breite etwas erhöht für das Layout */
      }

      .admin-section {
        background: rgba(25, 28, 36, 0.6);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 16px;
        padding: 30px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      }

      .admin-section h2 {
        font-family: var(--font-head);
        color: var(--color-primary);
        margin-top: 0;
        margin-bottom: 20px;
        font-size: 1.5rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      /* Liste */
      .list-container {
        max-height: 400px;
        overflow-y: auto;
        padding-right: 10px;
      }

      .list-container::-webkit-scrollbar {
        width: 6px;
      }
      .list-container::-webkit-scrollbar-track {
        background: rgba(255, 255, 255, 0.05);
        border-radius: 4px;
      }
      .list-container::-webkit-scrollbar-thumb {
        background: rgba(14, 165, 233, 0.3);
        border-radius: 4px;
      }
      .list-container::-webkit-scrollbar-thumb:hover {
        background: rgba(14, 165, 233, 0.6);
      }

      .list-item {
        background: rgba(0, 0, 0, 0.2);
        border: 1px solid rgba(255, 255, 255, 0.05);
        border-radius: 8px;
        padding: 15px;
        margin-bottom: 10px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .list-item-content {
        display: flex;
        align-items: center;
        gap: 15px;
      }

      .list-item-thumbnail {
        width: 50px;
        height: 50px;
        border-radius: 8px;
        object-fit: cover;
        background-color: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }

      .list-item-info strong {
        display: block;
        color: var(--color-text-main);
        margin-bottom: 4px;
      }

      .list-item-info span {
        font-size: 0.85rem;
        color: var(--color-text-muted);
      }

      .list-item-actions {
        display: flex;
        gap: 8px;
      }

      .btn-small {
        padding: 6px 12px;
        font-size: 0.85rem;
      }

      .btn-danger {
        border-color: #ef4444;
        color: #ef4444;
      }
      .btn-danger:hover {
        background: #ef4444;
        color: #fff;
        box-shadow: 0 0 15px rgba(239, 68, 68, 0.4);
      }

      /* Formular */
      .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 15px;
      }

      @media (max-width: 600px) {
        .form-grid {
          grid-template-columns: 1fr;
        }
      }

      .form-group {
        display: flex;
        flex-direction: column;
        overflow-y: auto;
        gap: 6px;
      }

      .form-group.full-width {
        grid-column: 1 / -1;
      }

      .form-group label {
        font-family: var(--font-body);
        font-size: 0.9rem;
        color: var(--color-text-muted);
      }

      .form-control {
        background: rgba(0, 0, 0, 0.3);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 8px;
        padding: 10px 12px;
        color: var(--color-text-main);
        font-family: var(--font-body);
        font-size: 1rem;
        width: 100%;
        transition: border-color 0.3s;
      }

      .form-control:focus {
        outline: none;
        border-color: var(--color-primary);
        box-shadow: 0 0 0 2px rgba(14, 165, 233, 0.2);
      }

      textarea.form-control {
        resize: vertical;
        min-height: 80px;
      }

      /* Messages */
      .message-box {
        padding: 12px 15px;
        border-radius: 8px;
        margin-bottom: 20px;
        font-family: var(--font-body);
        font-size: 0.9rem;
        display: none;
      }

      .message-box.success {
        display: block;
        background: rgba(16, 185, 129, 0.15);
        border: 1px solid #10b981;
        color: #10b981;
      }

      .message-box.error {
        display: block;
        background: rgba(239, 68, 68, 0.15);
        border: 1px solid #ef4444;
        color: #ef4444;
      }

      button[disabled] {
        opacity: 0.5;
        cursor: not-allowed;
      }
      /* Admin Map specific styling */
      #admin-map .leaflet-control-zoom a {
        background: var(--color-surface);
        color: var(--color-text-main);
        border-color: rgba(255, 255, 255, 0.1);
      }
      #admin-map .leaflet-control-zoom a:hover {
        background: var(--color-surface-hover);
        color: var(--color-primary);
      }
      #admin-map .leaflet-popup-content-wrapper,
      #admin-map .leaflet-popup-tip {
        background: var(--color-surface);
        color: var(--color-text-main);
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
      }
    </style>
  </head>
  <body>
    <a class="back-link" href="index.html">
      <svg
        fill="none"
        height="16"
        stroke="currentColor"
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="2"
        viewbox="0 0 24 24"
        width="16"
        xmlns="http://www.w3.org/2000/svg"
      >
        <line x1="19" x2="5" y1="12" y2="12"></line>
        <polyline points="12 19 5 12 12 5"></polyline>
      </svg>
      Zurück zur Karte
    </a>
    <div class="admin-wrapper">
      <div
        class="admin-card"
        id="auth-card"
        style="
          margin: auto;
          max-width: 500px;
          padding: 40px;
          margin-top: 10vh;
          display: flex;
          flex-direction: column;
          align-items: center;
        "
      >
        <h1 data-i18n="admin_title_main">Admin Bereich</h1>
        <div id="loading-container">
          <p>Status wird geprüft...</p>
        </div>
        <div class="hidden" id="login-container">
          <p>Bitte melde dich an, um den Administrationsbereich zu betreten.</p>
          <button class="btn" id="btn-login">
            <svg
              fill="none"
              height="18"
              stroke="currentColor"
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              viewbox="0 0 24 24"
              width="18"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
              <polyline points="10 17 15 12 10 7"></polyline>
              <line x1="15" x2="3" y1="12" y2="12"></line>
            </svg>
            <span data-i18n="admin_btn_login">Mit Google anmelden</span>
          </button>
        </div>
      </div>
      <div
        class="hidden"
        id="dashboard-container"
        style="display: flex; width: 100%; height: 100%"
      >
        <nav class="admin-sidebar">
          <div class="sidebar-logo">
            <h2
              style="
                color: var(--color-primary);
                font-family: var(--font-head);
                margin: 0;
                font-size: 1.2rem;
              "
            >
              Solargrafie
            </h2>
          </div>
          <div class="admin-nav-tabs" id="admin-tabs">
            <button class="btn" id="tab-btn-solargrafien" type="button">
              <span data-i18n="admin_tab_solargrafien">Solargrafien</span>
            </button>
            <button
              class="btn btn-secondary"
              id="tab-btn-translations"
              type="button"
            >
              <span data-i18n="admin_tab_translations">Übersetzungen</span>
            </button>
            <button class="btn btn-secondary" id="tab-btn-users" type="button">
              <span data-i18n="admin_tab_users">Benutzer</span>
            </button>
          </div>
          <div style="flex: 1"></div>
          <div style="padding-top: 20px">
            <button
              class="btn btn-secondary"
              id="btn-logout"
              style="width: 100%"
            >
              <svg
                fill="none"
                height="18"
                stroke="currentColor"
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                viewbox="0 0 24 24"
                width="18"
                xmlns="http://www.w3.org/2000/svg"
              >
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                <polyline points="16 17 21 12 16 7"></polyline>
                <line x1="21" x2="9" y1="12" y2="12"></line>
              </svg>
              <span data-i18n="admin_btn_logout">Abmelden</span>
            </button>
          </div>
        </nav>
        <div class="admin-main-content">
          <div
            style="
              display: flex;
              justify-content: space-between;
              align-items: center;
              margin-bottom: 24px;
            "
          >
            <h1
              data-i18n="admin_title_main"
              style="
                font-family: var(--font-head);
                color: var(--color-primary);
                margin: 0;
              "
            >
              Admin Bereich
            </h1>
            <div class="user-info">
              Eingeloggt als: <span class="user-email" id="user-email"></span>
            </div>
          </div>
          <div
            class="admin-layout"
            style="max-width: 100%; width: 100%; height: 100%"
          >
            <div class="message-box" id="status-message"></div>
            <div id="tab-solargrafien" class="dual-pane-layout">
              <!-- Left Column: List -->
              <div class="list-pane">
                <div class="list-header">
                  <div class="search-bar-wrapper">
                    <svg
                      class="search-icon"
                      width="16"
                      height="16"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    >
                      <circle cx="11" cy="11" r="8"></circle>
                      <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                    <input
                      class="search-input"
                      data-i18n-placeholder="admin_search_placeholder_solargrafien"
                      id="searchInput"
                      placeholder="Einträge durchsuchen..."
                      type="text"
                    />
                  </div>
                  <div class="filter-chips">
                    <button
                      class="filter-chip active"
                      type="button"
                      data-i18n="admin_filter_all"
                    >
                      Alle <span class="badge chip-count">0</span>
                    </button>
                    <button
                      class="filter-chip"
                      type="button"
                      data-i18n="admin_filter_active"
                    >
                      Aktiv <span class="badge chip-count">0</span>
                    </button>
                    <button
                      class="filter-chip"
                      type="button"
                      data-i18n="admin_filter_calculated"
                    >
                      Berechnet <span class="badge chip-count">0</span>
                    </button>
                    <button
                      class="filter-chip"
                      type="button"
                      data-i18n="admin_filter_draft"
                    >
                      Entwurf <span class="badge chip-count">0</span>
                    </button>
                  </div>
                  <div class="list-controls">
                    <button
                      class="btn btn-primary btn-small"
                      id="btn-new"
                      type="button"
                    >
                      <svg
                        width="14"
                        height="14"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                      >
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                      </svg>
                      <span data-i18n="admin_btn_new">Neu</span>
                    </button>
                    <button
                      class="btn btn-secondary btn-small btn-icon"
                      id="btn-refresh"
                      type="button"
                    >
                      <svg
                        width="14"
                        height="14"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                      >
                        <polyline points="23 4 23 10 17 10"></polyline>
                        <polyline points="1 20 1 14 7 14"></polyline>
                        <path
                          d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"
                        ></path>
                      </svg>
                    </button>
                  </div>
                </div>
                <div
                  class="list-container custom-scrollbar"
                  id="solargrafien-list"
                >
                  <p>Load..</p>
                </div>
              </div>

              <!-- Right Column: Form -->
              <div
                class="detail-pane custom-scrollbar"
                id="solargrafie-detail-pane"
              >
                <div
                  class="detail-form admin-section"
                  style="
                    border: none;
                    box-shadow: none;
                    background: transparent;
                    padding: 20px;
                  "
                >
                  <h2
                    data-i18n="admin_form_title_entry"
                    id="form-title"
                    style="margin-top: 0"
                  >
                    Eintrag
                  </h2>
                  <form id="solargrafie-form">
                    <input id="edit-id" name="id" type="hidden" value="" />
                    <div class="form-grid">
                      <div class="form-group full-width">
                        <label
                          data-i18n="admin_label_zeitstempel"
                          for="zeitstempel"
                          >Zeitstempel</label
                        >
                        <input
                          class="form-control"
                          id="zeitstempel"
                          name="zeitstempel"
                          readonly=""
                          type="text"
                        />
                      </div>
                      <div class="form-group full-width">
                        <label data-i18n="admin_label_titel" for="titel"
                          >Titel</label
                        >
                        <input
                          class="form-control"
                          id="titel"
                          name="titel"
                          required=""
                          type="text"
                        />
                      </div>
                      <div
                        class="form-group full-width"
                        style="display: flex; gap: 10px; align-items: flex-end"
                      >
                        <button
                          class="btn btn-secondary"
                          id="btn-open-map"
                          style="margin-bottom: 2px"
                          type="button"
                        >
                          🗺️ Auf Karte wählen
                        </button>
                        <div style="display: flex; gap: 10px; width: 100%">
                          <div style="flex: 1">
                            <label data-i18n="admin_label_lat" for="lat"
                              >Breitengrad (lat)</label
                            >
                            <input
                              class="form-control"
                              id="lat"
                              name="lat"
                              readonly=""
                              required=""
                              step="any"
                              type="number"
                            />
                          </div>
                          <div style="flex: 1">
                            <label data-i18n="admin_label_lng" for="lng"
                              >Längengrad (lng)</label
                            >
                            <input
                              class="form-control"
                              id="lng"
                              name="lng"
                              readonly=""
                              required=""
                              step="any"
                              type="number"
                            />
                          </div>
                        </div>
                      </div>
                      <div class="form-group">
                        <label data-i18n="admin_label_placed" for="placed"
                          >Datum Placed</label
                        >
                        <input
                          class="form-control"
                          id="placed"
                          name="placed"
                          required=""
                          type="date"
                        />
                      </div>
                      <div class="form-group">
                        <label data-i18n="admin_label_opened" for="opened"
                          >Datum Opened</label
                        >
                        <input
                          class="form-control"
                          id="opened"
                          name="opened"
                          type="date"
                        />
                      </div>
                      <div class="form-group">
                        <label data-i18n="admin_label_kamera" for="kamera"
                          >Kamera</label
                        >
                        <input
                          class="form-control"
                          id="kamera"
                          name="kamera"
                          type="text"
                        />
                      </div>
                      <div class="form-group">
                        <label
                          data-i18n="admin_label_fotopapier"
                          for="fotopapier"
                          >Fotopapier</label
                        >
                        <input
                          class="form-control"
                          id="fotopapier"
                          name="fotopapier"
                          type="text"
                        />
                      </div>
                      <div class="form-group full-width">
                        <label
                          data-i18n="admin_label_bild_haupt"
                          for="bild_haupt"
                          >Hauptbild (Finaler Scan)</label
                        >
                        <input
                          accept="image/jpeg, image/png, image/webp"
                          class="form-control"
                          id="bild_haupt"
                          name="bild_haupt"
                          type="file"
                        />
                        <div
                          class="preview-container hidden"
                          id="preview-container-haupt"
                          style="margin-top: 5px"
                        >
                          <img
                            alt="Vorschau Hauptbild"
                            id="preview-haupt"
                            src=""
                            style="
                              max-width: 100px;
                              max-height: 100px;
                              border-radius: 4px;
                            "
                          />
                        </div>
                      </div>
                      <div class="form-group full-width">
                        <label data-i18n="admin_label_bild_doku" for="bild_doku"
                          >Dokumentations-Foto (Dose vor Ort)</label
                        >
                        <input
                          accept="image/jpeg, image/png, image/webp"
                          class="form-control"
                          id="bild_doku"
                          name="bild_doku"
                          type="file"
                        />
                        <div
                          class="preview-container hidden"
                          id="preview-container-doku"
                          style="margin-top: 5px"
                        >
                          <img
                            alt="Vorschau Dokubild"
                            id="preview-doku"
                            src=""
                            style="
                              max-width: 100px;
                              max-height: 100px;
                              border-radius: 4px;
                            "
                          />
                        </div>
                      </div>
                      <div class="form-group full-width">
                        <label data-i18n="admin_label_bild_raw" for="bild_raw"
                          >Roh-Scan (Raw)</label
                        >
                        <input
                          accept="image/jpeg, image/png, image/webp, image/tiff"
                          class="form-control"
                          id="bild_raw"
                          name="bild_raw"
                          type="file"
                        />
                        <div
                          class="preview-container hidden"
                          id="preview-container-raw"
                          style="margin-top: 5px"
                        >
                          <img
                            alt="Vorschau Raw-Bild"
                            id="preview-raw"
                            src=""
                            style="
                              max-width: 100px;
                              max-height: 100px;
                              border-radius: 4px;
                            "
                          />
                        </div>
                      </div>
                      <div class="form-group full-width">
                        <label
                          data-i18n="admin_label_google_fotos_url"
                          for="google_fotos_url"
                          >Google Fotos URL</label
                        >
